    <header>

            <h1>D & A Planning co.</h1><br>

        </div>
        <div class="logo-container">

    <nav class="navigation">

            <div class="content-text">
                <h2>Track Your Plan</h2><br>

            </div>

    <div class="container">

        <input type="text" id="cellNumber" name="cellNumber" required><br><br>
    
    <!---Erf number and input label--->
    <form action="submit_enquiry.html" method="post">
        <label for="ErfNumber">Erf Number:</label><br>
        <input type="text" id="ErfNumber" name="ErfNumber" required><br><br>
    
    <!---Submit button for the form--->
    <form action="submit_enquiry.html" method="post">
        <input type="submit" value="Track Plan">
    </form>
